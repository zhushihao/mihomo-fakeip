  # =============================== -  匹配逻辑  - ================================
rules:
  # 0. 公司内网域名: 必须直连 + 内网 DNS 解析, 优先级高于广告拦截与 geosite 分流
  - DOMAIN-SUFFIX,bilibili.co,DIRECT
  - DOMAIN-SUFFIX,bilibili.local,DIRECT
  - DOMAIN-SUFFIX,slee.pt,默认代理
  # 1. 内网与私有网络 (直连)
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  # 2. PT/BT直连
  - RULE-SET,tracker,PT和BT下载,no-resolve
  - RULE-SET,category-pt,PT和BT下载,no-resolve
  # 3. 广告拦截 (最高优先级)
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,ad_ip,REJECT,no-resolve
  # 4. 哔哩哔哩
  - RULE-SET,bilibili,Bilibili
  # 5. Apple

  - RULE-SET,apple@cn,DIRECT
  - RULE-SET,apple,Apple
  # 6. 微软
  #    ※ 关键：上游 geosite 的 microsoft 分类里写了 include:github 与 include:xbox，
  #      即 github / xbox 的全部域名都包含在 microsoft 规则集内。
  #      因此 GitHub、Xbox 两条规则必须排在 microsoft 之前，否则会被吞掉走 Microsoft 组。
  - RULE-SET,github,GitHub
  - RULE-SET,xbox,Xbox
  - RULE-SET,microsoft@cn,DIRECT
  - RULE-SET,microsoft,Microsoft
  # 7. 港台媒体
  - RULE-SET,mytvsuper,港台媒体
  - RULE-SET,viu,港台媒体
  - RULE-SET,tvb,港台媒体
  - RULE-SET,kktv,港台媒体
  - RULE-SET,litv,港台媒体
  # biliapi港B站

  - DOMAIN-SUFFIX,biliapi.net,港台媒体
  - DOMAIN-SUFFIX,biliapi.com,港台媒体
  - DOMAIN-SUFFIX,bilivideo.com,港台媒体
  # 8. AI 相关服务
  - RULE-SET,gemini,Gemini
  - RULE-SET,openai,ChatGPT
  - RULE-SET,category-ai-!cn,AI集合
  # 9. Cloudflare 相关
  - RULE-SET,cloudflare@cn,DIRECT
  - RULE-SET,cloudflare,Cloudflare
  # 10. 国外媒体 (分流)
  #     注：github 已前置到第 6 段（详见该处说明），此处不再重复
  - RULE-SET,porn,Porn
  - RULE-SET,hbo,HBO
  - RULE-SET,emby,Emby
  - RULE-SET,tiktok,TikTok
  - RULE-SET,disney,Disney
  - RULE-SET,youtube,YouTube
  - RULE-SET,spotify,Spotify
  - RULE-SET,netflix,Netflix
  - RULE-SET,google,Google
  - RULE-SET,speedtest,Speedtest
  - RULE-SET,category-media,国外媒体集合
  # 11. 社交平台
  - RULE-SET,telegram,Telegram
  - RULE-SET,twitter,Twitter
  - RULE-SET,whatsapp,Whatsapp
  - RULE-SET,instagram,Instagram
  - RULE-SET,facebook,Facebook
  - RULE-SET,media-!cn,国外社交集合
  # 12. 游戏服务
  #     注：xbox 已前置到第 6 段（详见该处说明），此处不再重复
  - RULE-SET,steam@cn,DIRECT
  - RULE-SET,steam,Steam
  - RULE-SET,nintendo@cn,DIRECT
  - RULE-SET,nintendo,Nintendo
  - RULE-SET,playstation,PlayStation
  # 13. 国内禁的网站
  - RULE-SET,gfw,国外网站
  # 14. 国外网站
  - RULE-SET,geolocation-!cn,国外网站
  # 15. IP 规则分流 (no-resolve)
  - RULE-SET,apple_ip,Apple,no-resolve
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - RULE-SET,cloudflare_ip,Cloudflare,no-resolve
  - RULE-SET,emby_ip,Emby,no-resolve
  - RULE-SET,twitter_ip,Twitter,no-resolve
  - RULE-SET,facebook_ip,Facebook,no-resolve
  - RULE-SET,netflix_ip,Netflix,no-resolve
  - RULE-SET,google_ip,Google,no-resolve
  # 16. 国内直连兜底 (GeoIP & Geosite)
  - RULE-SET,cn,国内网站
  - RULE-SET,cn_ip,DIRECT
  # 17. 最终兜底规则
  - MATCH,漏网之鱼
# ========== EOF ============

redir-port: 23457
#面板设置
external-controller: 192.168.50.1:9990
external-ui: dashboard
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
secret: "clash"
#缓存设置
profile:
  store-selected: true
  store-fake-ip: true
#GEO数据库
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
#启动参数
allow-lan: true
mode: rule
log-level: info
# ↑ 排障期临时开 info；观察完请降到 warning。
#   info 会打印【每一条连接】（[TCP] 198.18.x.x:1234 --> 域名:443 using 香港），
#   路由器上多设备全天跑，量非常大，别长期开着，也别配 debug。
#   降到 warning 后仍能看到节点错误/订阅失败，只是没有连接流水。
ipv6: true
unified-delay: true
hosts:
  services.googleapis.cn: 74.125.193.94
  time.android.com: 203.107.6.88
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: false
  force-domain:
    - '+.v2ex.com'
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '+.apple.com'
dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  listen: :23453
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd6c:91f3:2b7a::/48
  fake-ip-filter-mode: rule
  respect-rules: true
  prefer-h3: false
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,category-pt,real-ip
    - RULE-SET,tracker,real-ip
    - RULE-SET,apple@cn,real-ip
    - RULE-SET,cn,real-ip
    - RULE-SET,cloudflare@cn,real-ip
    - RULE-SET,microsoft@cn,real-ip
    # 公司内网域名: 返回真实 IP, 否则 fake-ip 段地址在内网不可路由
    - '+.bilibili.co'
    - '+.bilibili.local'
  # 公司内网 DNS (办公网 DHCP 下发, 域 bilibili.local)
  # 优先级高于 direct-nameserver; 非办公网时超时后回落到下面的公共 DNS
  nameserver-policy:
    '+.bilibili.co':
      - 10.19.193.249
      - 10.19.193.250
    '+.bilibili.local':
      - 10.19.193.249
      - 10.19.193.250
  direct-nameserver:
    - 10.19.193.249
    - 10.19.193.250
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  nameserver:
    - https://223.5.5.5/dns-query#disable-qtype-65=true
    - https://119.29.29.29/dns-query#disable-qtype-65=true
tproxy-port: 23458
