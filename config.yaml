# ========================================================================
#              Fakeip.yaml - CCSwitchMulti 双组自动测速配置               #
#                                                     -- Mihomo v1.19.28+ #
#                                                                         #
#  === 当前版本：V3.9（2026-08-30）===                                #
#  版本历史：                                                             #
#   V1 (8-15)   VIP1 分组 url-test（地区组仅蓝胖云，未上传路由器）          #
#   V2 (8-16)   fallback 混合池（蓝胖云+良心云混用，无优先级）             #
#   V3 (8-19)   双组嵌套：地区组=fallback→[VIP1-XX, VIP2-XX]，5秒切换     #
#   V3.1 (8-19) 策略/均衡组 lazy:false+interval:5；子组 hidden:false      #
#   V3.2 (8-19) 荒郊/Speedtest 排垃圾词；新增 VIP1信息/VIP2信息 组        #
#   V3.3 (8-19) load-balance 子组 lazy:false+interval:5（策略/均衡自动切换）   #
#   V3.4 (8-21)  cn_ip 去 no-resolve（大陆IP规则修复，cheesefortune 等国内站直连）   #
#   V3.5 (8-23)  健康检查 URL 换 gstatic（Apple CDN 屏蔽机场IP致新加坡/韩国组假死）  #
#   V3.6 (8-29)  ① VIP 顺序对调：良心云→vip1(主用)，蓝胖云→vip2(兜底)      #
#                ② provider health-check interval 300→60 / lazy:false     #
#                  （节点真实测速间隔由 provider 决定，组 interval 管不到） #
#                ③ 两 provider 的 path 统一为语义化命名                    #
#   V3.7 (8-29)  全链路 interval 统一 5 秒：                               #
#                ① provider health-check interval 60→5（节点级真实测速）   #
#                ② 13 个 url-test 组 interval 300→5 且 lazy:true→false    #
#                  （12 个 VIP1/VIP2-XX + VIP2兜底）                       #
#                ③ 原有的 19 个 fallback / 24 个 load-balance 本就是 5     #
#                ※ 注意：provider 的 "interval":86400 是订阅更新周期，      #
#                  rule-providers 的 interval:86400 是规则集更新周期，      #
#                  两者与健康检查无关，不要一起改。                        #
#   V3.8 (8-29)  按「默认链路可达性」分级探测，保住 20 个链路组全速 5 秒：  #
#                ① 36 个闲置组（24 load-balance 子组 + 12 均衡/策略父组）   #
#                  interval 5→30、lazy:false→true（无流量不探测）          #
#                ② 24 个 load-balance 子组 hidden:false→true（面板不再刷屏）#
#                ③ 故障转移 select→fallback（名副其实），同样 30 / lazy    #
#                  ※ 关键：fallback 会主动探测成员，若这里给 interval:5    #
#                    会把刚休眠的策略体系重新唤醒，故必须一起 lazy 化       #
#                ④ fake-ip-filter 补 tracker→real-ip（修 BT 连不上 tracker）#
#                ⑤ geodata-mode / geox-url 保留：mihomo 对它是懒加载，      #
#                  无 GEOIP/GEOSITE 规则时不会下载，零成本，留作扩展口      #
#                                                                         #
#   V3.9 (8-30)  修「microsoft 规则集吞掉 github / xbox」的优先级反转：   #
#                ① 根因：上游 v2fly 的 data/microsoft 含 include:github   #
#                  与 include:xbox，微软收购 GitHub 后 github 全分类并入  #
#                  而 Microsoft 组首选项是 DIRECT，导致全部被直连         #
#                ② GitHub、Xbox 两条规则前置到第 6 段微软之前             #
#                ③ Microsoft、Apple 组首选项 DIRECT→默认代理              #
#                  （国内部分已由 microsoft@cn、apple@cn 单独直连）       #
#                ④ 删除第 10 / 12 段中重复的 github、xbox 死规则          #
#                ※ store-selected:true 会记住面板上的旧选择，             #
#                  改完必须在面板把 Microsoft、Apple 重选一次才生效       #
#  === 核心设计 ===                                                        #
#   1. 地区组自动测速：香港/台湾/新加坡/日本/韩国/美国 = url-test 选最快    #
#   2. VIP 双组兜底：良心云(vip1)优先，全挂→自动切蓝胖云(vip2)选最快       #
#   3. 智能故转/负载均衡：策略/均衡组 30 秒探测，面板切过去才唤醒          #
#   4. VIP1信息/VIP2信息：独立组查看剩余流量/套餐到期（非代理）            #
#                                                                         #
#  === 探测分级（V3.8 起，改动前务必看这里）===                           #
#   Tier-1 全速：provider hc 5s + 20 个链路组 5s / lazy:false             #
#                （主用线路 + 6 地区组 + 12 个 VIP1/VIP2-XX + VIP2兜底）   #
#   Tier-2 休眠：36 个闲置组 30s / lazy:true                              #
#                （24 个 load-balance 子组 + 12 个均衡/策略父组）          #
#   判定方法：从「默认代理」沿 select 首选项下钻，能到的就是 Tier-1        #
#   新增组时先问一句「它在默认链路上吗」，不在就给 30/lazy:true           #
#                                                                         #
#  上传步骤：填订阅地址 → 上传本文件到路由器 → 选本配置启动 → 面板验证      #
# =========================================================================
# 
# ============================= - fake-ip 的规则 - =========================
proxies:
# ============= - 加订阅链接位置 - ============
proxy-providers:
  # 良心云 —— VIP1，主用优先
  vip1:
    url: https://liangxin.xyz/api/v1/liangxin?OwO=4fdf5bcdf08aa3f2fcb28c914b4ef8bc #修改你的机场1订阅地址（记得前后隔个空格）
    "type": "http"
    "interval": 86400
    "proxy": "DIRECT"
    "health-check": {"enable": true, "url": "http://www.gstatic.com/generate_204", "interval": 5, "lazy": false}
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[良心云]"
      udp: true #如果不能用就改：false
    path: ./yaml_bak/Fakeip/vip1_liangxin
  # 蓝胖云 —— VIP2，兜底备用
  vip2:
    url: https://awy4.lpylink.com/link/62e7be0f78fcfd72b472cb3697b9c25c #修改你的机场2订阅地址（记得前后隔个空格）
    "type": "http"
    "interval": 86400
    "proxy": "DIRECT"
    "health-check": {"enable": true, "url": "http://www.gstatic.com/generate_204", "interval": 5, "lazy": false}
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[蓝胖云]"
      udp: true #如果不能用就改：false
    path: ./yaml_bak/Fakeip/vip2_lanpang
  
# ============  -  域名策略组  - ================
proxy-groups:
  # 总模式：
  - {name: 默认代理, "type": "select", "proxies": [主用线路, 自动选择, 智能故转, 负载均衡, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 荒郊地区, 全球手动, DIRECT], icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png',}
  # 机场信息节点（仅用于查看剩余流量/套餐到期，非代理）
  - {name: VIP1 信息, type: select, use: [vip1], filter: "^(?=.*(流量|剩余|到期|官网|套餐|邮箱|客服)).*$", icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Info.png'}   # 良心云
